# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Dark for Herdr. Herdr has no external theme files, so paste
# this into ~/.config/herdr/config.toml and reload with:
#   herdr server reload-config
#
# Simpler alternative: set theme.name = "terminal" and install the
# WezTerm or iTerm2 scheme from this repo, and Herdr follows the host
# terminal's ANSI palette with no per-token overrides at all.

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent        = "#e47534"
panel_bg      = "#1e1e1e"
sidebar_bg    = "#191919"
active_row_bg = "#252525"
selection_bg  = "#303030"
surface0      = "#252525"
surface1      = "#303030"
surface_dim   = "#141414"
overlay0      = "#3a3a3a"
overlay1      = "#8c8c8c"
text          = "#c9c9c9"
subtext0      = "#9e9e9e"
mauve         = "#c48ed0"   # our purple
green         = "#7ab03a"
yellow        = "#d28f27"   # our amber; the brand yellow is reserved for diff-changed
red           = "#e2548e"   # the Grafana brand has no red, so pink carries it
blue          = "#77a0d2"
teal          = "#48aa78"   # our light-green
peach         = "#e47534"   # our orange, same as accent

# With auto_switch = true, Herdr layers [theme.custom.light] and
# [theme.custom.dark] on top of [theme.custom]. See grafana-light
# in this directory for the other half.
