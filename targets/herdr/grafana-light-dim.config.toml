# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Light Dim for Herdr. Herdr has no external theme files, so paste
# this into ~/.config/herdr/config.toml and reload with:
#   herdr server reload-config
#
# Simpler alternative: set theme.name = "terminal" and install the
# WezTerm or iTerm2 scheme from this repo, and Herdr follows the host
# terminal's ANSI palette with no per-token overrides at all.

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent        = "#c05f46"
panel_bg      = "#f4f4f4"
sidebar_bg    = "#ececec"
active_row_bg = "#eaeaea"
selection_bg  = "#dedede"
surface0      = "#eaeaea"
surface1      = "#dedede"
surface_dim   = "#e2e2e2"
overlay0      = "#cfcfcf"
overlay1      = "#a0a0a0"
text          = "#3a3a3a"
subtext0      = "#6e6e6e"
mauve         = "#ac5fbc"   # our purple
green         = "#4c856b"
yellow        = "#ad7548"   # our amber; the brand yellow is reserved for diff-changed
red           = "#b65f7e"   # the Grafana brand has no red, so pink carries it
blue          = "#4b76c7"
teal          = "#678748"   # our light-green
peach         = "#c05f46"   # our orange, same as accent

# With auto_switch = true, Herdr layers [theme.custom.light] and
# [theme.custom.dark] on top of [theme.custom]. See grafana-dark-dim
# in this directory for the other half.
