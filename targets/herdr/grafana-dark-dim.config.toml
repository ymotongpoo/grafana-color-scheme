# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Dark Dim for Herdr. Herdr has no external theme files, so paste
# this into ~/.config/herdr/config.toml and reload with:
#   herdr server reload-config
#
# Simpler alternative: set theme.name = "terminal" and install the
# WezTerm or iTerm2 scheme from this repo, and Herdr follows the host
# terminal's ANSI palette with no per-token overrides at all.

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent        = "#e48a67"
panel_bg      = "#1e1e1e"
sidebar_bg    = "#181818"
active_row_bg = "#262626"
selection_bg  = "#303030"
surface0      = "#262626"
surface1      = "#303030"
surface_dim   = "#121212"
overlay0      = "#3d3d3d"
overlay1      = "#666666"
text          = "#cccccc"
subtext0      = "#8f8f8f"
mauve         = "#ca7cdb"   # our purple
green         = "#6db979"
yellow        = "#dbaa6d"   # our amber; the brand yellow is reserved for diff-changed
red           = "#de82a2"   # the Grafana brand has no red, so pink carries it
blue          = "#6794e8"
teal          = "#9ac274"   # our light-green
peach         = "#e48a67"   # our orange, same as accent

# With auto_switch = true, Herdr layers [theme.custom.light] and
# [theme.custom.dark] on top of [theme.custom]. See grafana-light-dim
# in this directory for the other half.
