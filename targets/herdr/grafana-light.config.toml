# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Light for Herdr. Herdr has no external theme files, so paste
# this into ~/.config/herdr/config.toml and reload with:
#   herdr server reload-config
#
# Simpler alternative: set theme.name = "terminal" and install the
# WezTerm or iTerm2 scheme from this repo, and Herdr follows the host
# terminal's ANSI palette with no per-token overrides at all.

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent        = "#c72f07"
panel_bg      = "#f7f7f7"
sidebar_bg    = "#f0f0f0"
active_row_bg = "#ececec"
selection_bg  = "#dcdcdc"
surface0      = "#ececec"
surface1      = "#dcdcdc"
surface_dim   = "#e4e4e4"
overlay0      = "#c9c9c9"
overlay1      = "#6a6a6a"
text          = "#3a3a3a"
subtext0      = "#5e5e5e"
mauve         = "#9d1ab1"   # our purple
green         = "#0b7347"
yellow        = "#915d14"   # our amber; the brand yellow is reserved for diff-changed
red           = "#a93c68"   # the Grafana brand has no red, so pink carries it
blue          = "#1540e0"
teal          = "#084b31"   # our light-green
peach         = "#c72f07"   # our orange, same as accent

# With auto_switch = true, Herdr layers [theme.custom.light] and
# [theme.custom.dark] on top of [theme.custom]. See grafana-dark
# in this directory for the other half.
