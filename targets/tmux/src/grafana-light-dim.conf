# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Light Dim for tmux. Colors only -- no status-line content.
# Source from ~/.tmux.conf:
#   source-file ~/.config/tmux/grafana/grafana-light-dim.conf
#
# Truecolor needs the terminal to advertise it. tmux 3.2+:
#   set -as terminal-features ',*:RGB'
# See the target README; this file does not set server options.

#+--- Palette, published as user options ---+
set -gq @grafana_bg "#f4f4f4"
set -gq @grafana_bg_alt "#ececec"
set -gq @grafana_surface "#eaeaea"
set -gq @grafana_border "#dedede"
set -gq @grafana_fg "#3a3a3a"
set -gq @grafana_subtext "#6e6e6e"
set -gq @grafana_faint "#a0a0a0"
set -gq @grafana_bright "#171717"
set -gq @grafana_orange "#c05f46"
set -gq @grafana_amber "#ad7548"
set -gq @grafana_yellow "#947347"
set -gq @grafana_green "#4c856b"
set -gq @grafana_light_green "#678748"
set -gq @grafana_light_blue "#4c8597"
set -gq @grafana_blue "#4b76c7"
set -gq @grafana_indigo "#756ec6"
set -gq @grafana_purple "#ac5fbc"
set -gq @grafana_pink "#b65f7e"

#+--- Status line ---+
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#ececec,fg=#3a3a3a"
set -g status-left-style "default"
set -g status-right-style "default"

#+--- Windows ---+
set -g window-status-style "bg=#ececec,fg=#a0a0a0"
set -g window-status-current-style "bg=#f4f4f4,fg=#c05f46,bold"
set -g window-status-last-style "fg=#4b76c7"
set -g window-status-activity-style "fg=#ad7548,none"
set -g window-status-bell-style "fg=#b65f7e,none"

#+--- Panes ---+
set -g pane-border-style "bg=default,fg=#dedede"
set -g pane-active-border-style "bg=default,fg=#c05f46"
set -g pane-status-style "bg=#ececec,fg=#a0a0a0"
set -g pane-status-current-style "bg=#ececec,fg=#c05f46"
set -g display-panes-colour "#cfcfcf"
set -g display-panes-active-colour "#c05f46"

#+--- Messages and the command prompt ---+
set -g message-style "bg=#eaeaea,fg=#4b76c7"
set -g message-command-style "bg=#eaeaea,fg=#4b76c7"

#+--- Copy and choose modes ---+
set -g mode-style "bg=#cfcfcf,fg=#171717"
set -g copy-mode-match-style "bg=#ad7548,fg=#f4f4f4"
set -g copy-mode-current-match-style "bg=#c05f46,fg=#f4f4f4"
set -g copy-mode-selection-style "bg=#cfcfcf,fg=#171717"
set -g copy-mode-mark-style "bg=#4b76c7,fg=#f4f4f4"

#+--- Clock ---+
setw -g clock-mode-colour "#c05f46"
setw -g clock-mode-style 24

#+--- Popups and menus (tmux 3.2+) ---+
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" \!= "" ] && [ "$(printf "%s\\n3.2\\n" "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" | sort -V | head -1)" = "3.2" ]' \
  'set -g popup-style "bg=#ececec,fg=#3a3a3a" ; \
   set -g popup-border-style "fg=#c05f46" ; \
   set -g menu-style "bg=#ececec,fg=#3a3a3a" ; \
   set -g menu-selected-style "bg=#4b76c7,fg=#f4f4f4" ; \
   set -g menu-border-style "fg=#cfcfcf"'

#+--- Hand-off to third-party plugins ---+
set -gq @prefix_highlight_fg "#f4f4f4"
set -gq @prefix_highlight_bg "#c05f46"
