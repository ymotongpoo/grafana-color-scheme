#
# Optional status-line CONTENT for Grafana Dark Dim. Source this AFTER the theme
# only if you want the layout too:
#   source-file ~/.config/tmux/grafana/grafana-dark-dim.conf
#   source-file ~/.config/tmux/grafana/grafana-dark-dim-status.conf
#
# Plain ASCII separators, so no patched font is required.

set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#1e1e1e,bg=#e48a67,bold] #S #[fg=#e48a67,bg=#181818,nobold] "
set -g status-right "#[fg=#666666]%Y-%m-%d #[fg=#8f8f8f]%H:%M #[fg=#1e1e1e,bg=#6794e8,bold] #h "

set -g window-status-format " #I #W#{?window_flags,#{window_flags}, } "
set -g window-status-current-format " #I #W#{?window_flags,#{window_flags}, } "
set -g window-status-separator ""
