# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Optional status-line CONTENT for Grafana Dark. Source this AFTER the theme
# only if you want the layout too:
#   source-file ~/.config/tmux/grafana/grafana-dark.conf
#   source-file ~/.config/tmux/grafana/grafana-dark-status.conf
#
# Plain ASCII separators, so no patched font is required.

set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#241f1c,bg=#c18c68,bold] #S #[fg=#c18c68,bg=#1e1916,nobold] "
set -g status-right "#[fg=#786d63]%Y-%m-%d #[fg=#8d8279]%H:%M #[fg=#241f1c,bg=#ad8eaf,bold] #h "

set -g window-status-format " #I #W#{?window_flags,#{window_flags}, } "
set -g window-status-current-format " #I #W#{?window_flags,#{window_flags}, } "
set -g window-status-separator ""
