# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Dark Dim for tmux. Colors only -- no status-line content.
# Source from ~/.tmux.conf:
#   source-file ~/.config/tmux/grafana/grafana-dark-dim.conf
#
# Truecolor needs the terminal to advertise it. tmux 3.2+:
#   set -as terminal-features ',*:RGB'
# See the target README; this file does not set server options.

#+--- Palette, published as user options ---+
set -gq @grafana_bg "#1e1e1e"
set -gq @grafana_bg_alt "#181818"
set -gq @grafana_surface "#262626"
set -gq @grafana_border "#303030"
set -gq @grafana_fg "#cccccc"
set -gq @grafana_subtext "#8f8f8f"
set -gq @grafana_faint "#666666"
set -gq @grafana_bright "#e8e8e8"
set -gq @grafana_orange "#e48a67"
set -gq @grafana_amber "#dbaa6d"
set -gq @grafana_yellow "#d3ca6e"
set -gq @grafana_green "#6db979"
set -gq @grafana_light_green "#9ac274"
set -gq @grafana_light_blue "#78bad0"
set -gq @grafana_blue "#6794e8"
set -gq @grafana_indigo "#928ce7"
set -gq @grafana_purple "#ca7cdb"
set -gq @grafana_pink "#de82a2"

#+--- Status line ---+
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#181818,fg=#cccccc"
set -g status-left-style "default"
set -g status-right-style "default"

#+--- Windows ---+
set -g window-status-style "bg=#181818,fg=#666666"
set -g window-status-current-style "bg=#1e1e1e,fg=#e48a67,bold"
set -g window-status-last-style "fg=#6794e8"
set -g window-status-activity-style "fg=#dbaa6d,none"
set -g window-status-bell-style "fg=#de82a2,none"

#+--- Panes ---+
set -g pane-border-style "bg=default,fg=#303030"
set -g pane-active-border-style "bg=default,fg=#e48a67"
set -g pane-status-style "bg=#181818,fg=#666666"
set -g pane-status-current-style "bg=#181818,fg=#e48a67"
set -g display-panes-colour "#3d3d3d"
set -g display-panes-active-colour "#e48a67"

#+--- Messages and the command prompt ---+
set -g message-style "bg=#262626,fg=#6794e8"
set -g message-command-style "bg=#262626,fg=#6794e8"

#+--- Copy and choose modes ---+
set -g mode-style "bg=#3d3d3d,fg=#e8e8e8"
set -g copy-mode-match-style "bg=#dbaa6d,fg=#1e1e1e"
set -g copy-mode-current-match-style "bg=#e48a67,fg=#1e1e1e"
set -g copy-mode-selection-style "bg=#3d3d3d,fg=#e8e8e8"
set -g copy-mode-mark-style "bg=#6794e8,fg=#1e1e1e"

#+--- Clock ---+
setw -g clock-mode-colour "#e48a67"
setw -g clock-mode-style 24

#+--- Popups and menus (tmux 3.2+) ---+
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" \!= "" ] && [ "$(printf "%s\\n3.2\\n" "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" | sort -V | head -1)" = "3.2" ]' \
  'set -g popup-style "bg=#181818,fg=#cccccc" ; \
   set -g popup-border-style "fg=#e48a67" ; \
   set -g menu-style "bg=#181818,fg=#cccccc" ; \
   set -g menu-selected-style "bg=#6794e8,fg=#1e1e1e" ; \
   set -g menu-border-style "fg=#3d3d3d"'

#+--- Hand-off to third-party plugins ---+
set -gq @prefix_highlight_fg "#1e1e1e"
set -gq @prefix_highlight_bg "#e48a67"
