# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Optional status-line CONTENT for Grafana Light Dim. Source this AFTER the theme
# only if you want the layout too:
#   source-file ~/.config/tmux/grafana/grafana-light-dim.conf
#   source-file ~/.config/tmux/grafana/grafana-light-dim-status.conf
#
# Plain ASCII separators, so no patched font is required.

set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#f4f4f4,bg=#c05f46,bold] #S #[fg=#c05f46,bg=#ececec,nobold] "
set -g status-right "#[fg=#a0a0a0]%Y-%m-%d #[fg=#6e6e6e]%H:%M #[fg=#f4f4f4,bg=#4b76c7,bold] #h "

set -g window-status-format " #I #W#{?window_flags,#{window_flags}, } "
set -g window-status-current-format " #I #W#{?window_flags,#{window_flags}, } "
set -g window-status-separator ""
