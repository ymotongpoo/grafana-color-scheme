# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Dark for tmux. Colors only -- no status-line content.
# Source from ~/.tmux.conf:
#   source-file ~/.config/tmux/grafana/grafana-dark.conf
#
# Truecolor needs the terminal to advertise it. tmux 3.2+:
#   set -as terminal-features ',*:RGB'
# See the target README; this file does not set server options.

#+--- Palette, published as user options ---+
set -gq @grafana_bg "#241f1c"
set -gq @grafana_bg_alt "#1e1916"
set -gq @grafana_surface "#2c2622"
set -gq @grafana_border "#362f2a"
set -gq @grafana_fg "#b9b1a9"
set -gq @grafana_subtext "#8d8279"
set -gq @grafana_faint "#786d63"
set -gq @grafana_bright "#cbc3ba"
set -gq @grafana_orange "#c18c68"
set -gq @grafana_amber "#b4a075"
set -gq @grafana_yellow "#acaa70"
set -gq @grafana_green "#89a17e"
set -gq @grafana_light_green "#79a08a"
set -gq @grafana_light_blue "#789fa6"
set -gq @grafana_blue "#8198b5"
set -gq @grafana_indigo "#8d86b1"
set -gq @grafana_purple "#ad8eaf"
set -gq @grafana_pink "#b77f94"

#+--- Status line ---+
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1916,fg=#b9b1a9"
set -g status-left-style "default"
set -g status-right-style "default"

#+--- Windows ---+
set -g window-status-style "bg=#1e1916,fg=#786d63"
set -g window-status-current-style "bg=#241f1c,fg=#c18c68,bold"
set -g window-status-last-style "fg=#ad8eaf"
set -g window-status-activity-style "fg=#b4a075,none"
set -g window-status-bell-style "fg=#b77f94,none"

#+--- Panes ---+
set -g pane-border-style "bg=default,fg=#362f2a"
set -g pane-active-border-style "bg=default,fg=#c18c68"
set -g pane-status-style "bg=#1e1916,fg=#786d63"
set -g pane-status-current-style "bg=#1e1916,fg=#c18c68"
set -g display-panes-colour "#423932"
set -g display-panes-active-colour "#c18c68"

#+--- Messages and the command prompt ---+
set -g message-style "bg=#2c2622,fg=#ad8eaf"
set -g message-command-style "bg=#2c2622,fg=#ad8eaf"

#+--- Copy and choose modes ---+
set -g mode-style "bg=#423932,fg=#cbc3ba"
set -g copy-mode-match-style "bg=#b4a075,fg=#241f1c"
set -g copy-mode-current-match-style "bg=#c18c68,fg=#241f1c"
set -g copy-mode-selection-style "bg=#423932,fg=#cbc3ba"
set -g copy-mode-mark-style "bg=#ad8eaf,fg=#241f1c"

#+--- Clock ---+
setw -g clock-mode-colour "#c18c68"
setw -g clock-mode-style 24

#+--- Popups and menus (tmux 3.2+) ---+
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" \!= "" ] && [ "$(printf "%s\\n3.2\\n" "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" | sort -V | head -1)" = "3.2" ]' \
  'set -g popup-style "bg=#1e1916,fg=#b9b1a9" ; \
   set -g popup-border-style "fg=#c18c68" ; \
   set -g menu-style "bg=#1e1916,fg=#b9b1a9" ; \
   set -g menu-selected-style "bg=#ad8eaf,fg=#241f1c" ; \
   set -g menu-border-style "fg=#423932"'

#+--- Hand-off to third-party plugins ---+
set -gq @prefix_highlight_fg "#241f1c"
set -gq @prefix_highlight_bg "#c18c68"
