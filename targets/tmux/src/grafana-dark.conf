# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Dark for tmux. Colors only -- no status-line content.
# Source from ~/.tmux.conf:
#   source-file ~/.config/tmux/grafana/grafana-dark.conf
#
# Truecolor needs the terminal to advertise it. tmux 3.2+:
#   set -as terminal-features ',*:RGB'
# See the target README; this file does not set server options.

#+--- Palette, published as user options ---+
set -gq @grafana_bg "#1e1e1e"
set -gq @grafana_bg_alt "#191919"
set -gq @grafana_surface "#252525"
set -gq @grafana_border "#303030"
set -gq @grafana_fg "#c9c9c9"
set -gq @grafana_subtext "#9e9e9e"
set -gq @grafana_faint "#8c8c8c"
set -gq @grafana_bright "#f4f4f4"
set -gq @grafana_orange "#e47534"
set -gq @grafana_amber "#d28f27"
set -gq @grafana_yellow "#bdaa2f"
set -gq @grafana_green "#7ab03a"
set -gq @grafana_light_green "#48aa78"
set -gq @grafana_light_blue "#38a4c2"
set -gq @grafana_blue "#77a0d2"
set -gq @grafana_indigo "#9084d7"
set -gq @grafana_purple "#c48ed0"
set -gq @grafana_pink "#e2548e"

#+--- Status line ---+
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#191919,fg=#c9c9c9"
set -g status-left-style "default"
set -g status-right-style "default"

#+--- Windows ---+
set -g window-status-style "bg=#191919,fg=#8c8c8c"
set -g window-status-current-style "bg=#1e1e1e,fg=#e47534,bold"
set -g window-status-last-style "fg=#c48ed0"
set -g window-status-activity-style "fg=#d28f27,none"
set -g window-status-bell-style "fg=#e2548e,none"

#+--- Panes ---+
set -g pane-border-style "bg=default,fg=#303030"
set -g pane-active-border-style "bg=default,fg=#e47534"
set -g pane-status-style "bg=#191919,fg=#8c8c8c"
set -g pane-status-current-style "bg=#191919,fg=#e47534"
set -g display-panes-colour "#3a3a3a"
set -g display-panes-active-colour "#e47534"

#+--- Messages and the command prompt ---+
set -g message-style "bg=#252525,fg=#c48ed0"
set -g message-command-style "bg=#252525,fg=#c48ed0"

#+--- Copy and choose modes ---+
set -g mode-style "bg=#3a3a3a,fg=#f4f4f4"
set -g copy-mode-match-style "bg=#d28f27,fg=#1e1e1e"
set -g copy-mode-current-match-style "bg=#e47534,fg=#1e1e1e"
set -g copy-mode-selection-style "bg=#3a3a3a,fg=#f4f4f4"
set -g copy-mode-mark-style "bg=#c48ed0,fg=#1e1e1e"

#+--- Clock ---+
setw -g clock-mode-colour "#e47534"
setw -g clock-mode-style 24

#+--- Popups and menus (tmux 3.2+) ---+
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" \!= "" ] && [ "$(printf "%s\\n3.2\\n" "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" | sort -V | head -1)" = "3.2" ]' \
  'set -g popup-style "bg=#191919,fg=#c9c9c9" ; \
   set -g popup-border-style "fg=#e47534" ; \
   set -g menu-style "bg=#191919,fg=#c9c9c9" ; \
   set -g menu-selected-style "bg=#c48ed0,fg=#1e1e1e" ; \
   set -g menu-border-style "fg=#3a3a3a"'

#+--- Hand-off to third-party plugins ---+
set -gq @prefix_highlight_fg "#1e1e1e"
set -gq @prefix_highlight_bg "#e47534"
