# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Dark for tmux. Colors only -- no status-line content.
# Source from ~/.tmux.conf:
#   source-file ~/.config/tmux/grafana/grafana-dark.conf
#
# Truecolor needs the terminal to advertise it. tmux 3.2+:
#   set -as terminal-features ',*:RGB'
# See the target README; this file does not set server options.

#+--- Palette, published as user options ---+
set -gq @grafana_bg "#171717"
set -gq @grafana_bg_alt "#111111"
set -gq @grafana_surface "#212121"
set -gq @grafana_border "#2c2c2c"
set -gq @grafana_fg "#f4f4f4"
set -gq @grafana_subtext "#afafaf"
set -gq @grafana_faint "#696969"
set -gq @grafana_bright "#ffffff"
set -gq @grafana_orange "#ff671d"
set -gq @grafana_amber "#ffab29"
set -gq @grafana_yellow "#ffed23"
set -gq @grafana_green "#04bc4c"
set -gq @grafana_light_green "#91d441"
set -gq @grafana_light_blue "#3fc6eb"
set -gq @grafana_blue "#2970ff"
set -gq @grafana_indigo "#7d64ff"
set -gq @grafana_purple "#d444f1"
set -gq @grafana_pink "#f35998"

#+--- Status line ---+
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#111111,fg=#f4f4f4"
set -g status-left-style "default"
set -g status-right-style "default"

#+--- Windows ---+
set -g window-status-style "bg=#111111,fg=#696969"
set -g window-status-current-style "bg=#171717,fg=#ff671d,bold"
set -g window-status-last-style "fg=#2970ff"
set -g window-status-activity-style "fg=#ffab29,none"
set -g window-status-bell-style "fg=#f35998,none"

#+--- Panes ---+
set -g pane-border-style "bg=default,fg=#2c2c2c"
set -g pane-active-border-style "bg=default,fg=#ff671d"
set -g pane-status-style "bg=#111111,fg=#696969"
set -g pane-status-current-style "bg=#111111,fg=#ff671d"
set -g display-panes-colour "#3a3a3a"
set -g display-panes-active-colour "#ff671d"

#+--- Messages and the command prompt ---+
set -g message-style "bg=#212121,fg=#2970ff"
set -g message-command-style "bg=#212121,fg=#2970ff"

#+--- Copy and choose modes ---+
set -g mode-style "bg=#3a3a3a,fg=#ffffff"
set -g copy-mode-match-style "bg=#ffab29,fg=#171717"
set -g copy-mode-current-match-style "bg=#ff671d,fg=#171717"
set -g copy-mode-selection-style "bg=#3a3a3a,fg=#ffffff"
set -g copy-mode-mark-style "bg=#2970ff,fg=#171717"

#+--- Clock ---+
setw -g clock-mode-colour "#ff671d"
setw -g clock-mode-style 24

#+--- Popups and menus (tmux 3.2+) ---+
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" \!= "" ] && [ "$(printf "%s\\n3.2\\n" "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" | sort -V | head -1)" = "3.2" ]' \
  'set -g popup-style "bg=#111111,fg=#f4f4f4" ; \
   set -g popup-border-style "fg=#ff671d" ; \
   set -g menu-style "bg=#111111,fg=#f4f4f4" ; \
   set -g menu-selected-style "bg=#2970ff,fg=#171717" ; \
   set -g menu-border-style "fg=#3a3a3a"'

#+--- Hand-off to third-party plugins ---+
set -gq @prefix_highlight_fg "#171717"
set -gq @prefix_highlight_bg "#ff671d"
