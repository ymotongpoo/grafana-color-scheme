# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Light for tmux. Colors only -- no status-line content.
# Source from ~/.tmux.conf:
#   source-file ~/.config/tmux/grafana/grafana-light.conf
#
# Truecolor needs the terminal to advertise it. tmux 3.2+:
#   set -as terminal-features ',*:RGB'
# See the target README; this file does not set server options.

#+--- Palette, published as user options ---+
set -gq @grafana_bg "#ffffff"
set -gq @grafana_bg_alt "#f4f4f4"
set -gq @grafana_surface "#f2f2f2"
set -gq @grafana_border "#e6e6e6"
set -gq @grafana_fg "#171717"
set -gq @grafana_subtext "#696969"
set -gq @grafana_faint "#afafaf"
set -gq @grafana_bright "#000000"
set -gq @grafana_orange "#f04205"
set -gq @grafana_amber "#d6760b"
set -gq @grafana_yellow "#aa710e"
set -gq @grafana_green "#0c9065"
set -gq @grafana_light_green "#5f940e"
set -gq @grafana_light_blue "#0a92b1"
set -gq @grafana_blue "#2970ff"
set -gq @grafana_indigo "#7d64ff"
set -gq @grafana_purple "#d444f1"
set -gq @grafana_pink "#e14889"

#+--- Status line ---+
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#f4f4f4,fg=#171717"
set -g status-left-style "default"
set -g status-right-style "default"

#+--- Windows ---+
set -g window-status-style "bg=#f4f4f4,fg=#afafaf"
set -g window-status-current-style "bg=#ffffff,fg=#f04205,bold"
set -g window-status-last-style "fg=#2970ff"
set -g window-status-activity-style "fg=#d6760b,none"
set -g window-status-bell-style "fg=#e14889,none"

#+--- Panes ---+
set -g pane-border-style "bg=default,fg=#e6e6e6"
set -g pane-active-border-style "bg=default,fg=#f04205"
set -g pane-status-style "bg=#f4f4f4,fg=#afafaf"
set -g pane-status-current-style "bg=#f4f4f4,fg=#f04205"
set -g display-panes-colour "#d6d6d6"
set -g display-panes-active-colour "#f04205"

#+--- Messages and the command prompt ---+
set -g message-style "bg=#f2f2f2,fg=#2970ff"
set -g message-command-style "bg=#f2f2f2,fg=#2970ff"

#+--- Copy and choose modes ---+
set -g mode-style "bg=#d6d6d6,fg=#000000"
set -g copy-mode-match-style "bg=#d6760b,fg=#ffffff"
set -g copy-mode-current-match-style "bg=#f04205,fg=#ffffff"
set -g copy-mode-selection-style "bg=#d6d6d6,fg=#000000"
set -g copy-mode-mark-style "bg=#2970ff,fg=#ffffff"

#+--- Clock ---+
setw -g clock-mode-colour "#f04205"
setw -g clock-mode-style 24

#+--- Popups and menus (tmux 3.2+) ---+
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" \!= "" ] && [ "$(printf "%s\\n3.2\\n" "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" | sort -V | head -1)" = "3.2" ]' \
  'set -g popup-style "bg=#f4f4f4,fg=#171717" ; \
   set -g popup-border-style "fg=#f04205" ; \
   set -g menu-style "bg=#f4f4f4,fg=#171717" ; \
   set -g menu-selected-style "bg=#2970ff,fg=#ffffff" ; \
   set -g menu-border-style "fg=#d6d6d6"'

#+--- Hand-off to third-party plugins ---+
set -gq @prefix_highlight_fg "#ffffff"
set -gq @prefix_highlight_bg "#f04205"
