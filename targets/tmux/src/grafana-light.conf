# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Light for tmux. Colors only -- no status-line content.
# Source from ~/.tmux.conf:
#   source-file ~/.config/tmux/grafana/grafana-light.conf
#
# Truecolor needs the terminal to advertise it. tmux 3.2+:
#   set -as terminal-features ',*:RGB'
# See the target README; this file does not set server options.

#+--- Palette, published as user options ---+
set -gq @grafana_bg "#f7f7f7"
set -gq @grafana_bg_alt "#f0f0f0"
set -gq @grafana_surface "#ececec"
set -gq @grafana_border "#dcdcdc"
set -gq @grafana_fg "#3a3a3a"
set -gq @grafana_subtext "#5e5e5e"
set -gq @grafana_faint "#6a6a6a"
set -gq @grafana_bright "#171717"
set -gq @grafana_orange "#c72f07"
set -gq @grafana_amber "#915d14"
set -gq @grafana_yellow "#6f681c"
set -gq @grafana_green "#0b7347"
set -gq @grafana_light_green "#084b31"
set -gq @grafana_light_blue "#25708a"
set -gq @grafana_blue "#1540e0"
set -gq @grafana_indigo "#5240b8"
set -gq @grafana_purple "#9d1ab1"
set -gq @grafana_pink "#a93c68"

#+--- Status line ---+
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#f0f0f0,fg=#3a3a3a"
set -g status-left-style "default"
set -g status-right-style "default"

#+--- Windows ---+
set -g window-status-style "bg=#f0f0f0,fg=#6a6a6a"
set -g window-status-current-style "bg=#f7f7f7,fg=#c72f07,bold"
set -g window-status-last-style "fg=#9d1ab1"
set -g window-status-activity-style "fg=#915d14,none"
set -g window-status-bell-style "fg=#a93c68,none"

#+--- Panes ---+
set -g pane-border-style "bg=default,fg=#dcdcdc"
set -g pane-active-border-style "bg=default,fg=#c72f07"
set -g pane-status-style "bg=#f0f0f0,fg=#6a6a6a"
set -g pane-status-current-style "bg=#f0f0f0,fg=#c72f07"
set -g display-panes-colour "#c9c9c9"
set -g display-panes-active-colour "#c72f07"

#+--- Messages and the command prompt ---+
set -g message-style "bg=#ececec,fg=#9d1ab1"
set -g message-command-style "bg=#ececec,fg=#9d1ab1"

#+--- Copy and choose modes ---+
set -g mode-style "bg=#c9c9c9,fg=#171717"
set -g copy-mode-match-style "bg=#915d14,fg=#f7f7f7"
set -g copy-mode-current-match-style "bg=#c72f07,fg=#f7f7f7"
set -g copy-mode-selection-style "bg=#c9c9c9,fg=#171717"
set -g copy-mode-mark-style "bg=#9d1ab1,fg=#f7f7f7"

#+--- Clock ---+
setw -g clock-mode-colour "#c72f07"
setw -g clock-mode-style 24

#+--- Popups and menus (tmux 3.2+) ---+
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" \!= "" ] && [ "$(printf "%s\\n3.2\\n" "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" | sort -V | head -1)" = "3.2" ]' \
  'set -g popup-style "bg=#f0f0f0,fg=#3a3a3a" ; \
   set -g popup-border-style "fg=#c72f07" ; \
   set -g menu-style "bg=#f0f0f0,fg=#3a3a3a" ; \
   set -g menu-selected-style "bg=#9d1ab1,fg=#f7f7f7" ; \
   set -g menu-border-style "fg=#c9c9c9"'

#+--- Hand-off to third-party plugins ---+
set -gq @prefix_highlight_fg "#f7f7f7"
set -gq @prefix_highlight_bg "#c72f07"
