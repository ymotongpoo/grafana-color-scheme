# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Grafana Light for tmux. Colors only -- no status-line content.
# Source from ~/.tmux.conf:
#   source-file ~/.config/tmux/grafana/grafana-light.conf
#
# Truecolor needs the terminal to advertise it. tmux 3.2+:
#   set -as terminal-features ',*:RGB'
# See the target README; this file does not set server options.

#+--- Palette, published as user options ---+
set -gq @grafana_bg "#e8e1d9"
set -gq @grafana_bg_alt "#e0d7cd"
set -gq @grafana_surface "#e0d5ca"
set -gq @grafana_border "#d3c5b8"
set -gq @grafana_fg "#6b625b"
set -gq @grafana_subtext "#928579"
set -gq @grafana_faint "#a89b8e"
set -gq @grafana_bright "#574e47"
set -gq @grafana_orange "#ac795a"
set -gq @grafana_amber "#a08a61"
set -gq @grafana_yellow "#989363"
set -gq @grafana_green "#7d9068"
set -gq @grafana_light_green "#6f9381"
set -gq @grafana_light_blue "#719399"
set -gq @grafana_blue "#7b8da5"
set -gq @grafana_indigo "#8a80aa"
set -gq @grafana_purple "#a183a2"
set -gq @grafana_pink "#ac7b8d"

#+--- Status line ---+
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#e0d7cd,fg=#6b625b"
set -g status-left-style "default"
set -g status-right-style "default"

#+--- Windows ---+
set -g window-status-style "bg=#e0d7cd,fg=#a89b8e"
set -g window-status-current-style "bg=#e8e1d9,fg=#ac795a,bold"
set -g window-status-last-style "fg=#a183a2"
set -g window-status-activity-style "fg=#a08a61,none"
set -g window-status-bell-style "fg=#ac7b8d,none"

#+--- Panes ---+
set -g pane-border-style "bg=default,fg=#d3c5b8"
set -g pane-active-border-style "bg=default,fg=#ac795a"
set -g pane-status-style "bg=#e0d7cd,fg=#a89b8e"
set -g pane-status-current-style "bg=#e0d7cd,fg=#ac795a"
set -g display-panes-colour "#c4b2a2"
set -g display-panes-active-colour "#ac795a"

#+--- Messages and the command prompt ---+
set -g message-style "bg=#e0d5ca,fg=#a183a2"
set -g message-command-style "bg=#e0d5ca,fg=#a183a2"

#+--- Copy and choose modes ---+
set -g mode-style "bg=#c4b2a2,fg=#574e47"
set -g copy-mode-match-style "bg=#a08a61,fg=#e8e1d9"
set -g copy-mode-current-match-style "bg=#ac795a,fg=#e8e1d9"
set -g copy-mode-selection-style "bg=#c4b2a2,fg=#574e47"
set -g copy-mode-mark-style "bg=#a183a2,fg=#e8e1d9"

#+--- Clock ---+
setw -g clock-mode-colour "#ac795a"
setw -g clock-mode-style 24

#+--- Popups and menus (tmux 3.2+) ---+
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" \!= "" ] && [ "$(printf "%s\\n3.2\\n" "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" | sort -V | head -1)" = "3.2" ]' \
  'set -g popup-style "bg=#e0d7cd,fg=#6b625b" ; \
   set -g popup-border-style "fg=#ac795a" ; \
   set -g menu-style "bg=#e0d7cd,fg=#6b625b" ; \
   set -g menu-selected-style "bg=#a183a2,fg=#e8e1d9" ; \
   set -g menu-border-style "fg=#c4b2a2"'

#+--- Hand-off to third-party plugins ---+
set -gq @prefix_highlight_fg "#e8e1d9"
set -gq @prefix_highlight_bg "#ac795a"
