# Generated by tools/generate.py from palette.toml. Do not edit.
#
# Optional status-line CONTENT for Grafana Light. Source this AFTER the theme
# only if you want the layout too:
#   source-file ~/.config/tmux/grafana/grafana-light.conf
#   source-file ~/.config/tmux/grafana/grafana-light-status.conf
#
# Plain ASCII separators, so no patched font is required.

set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#e8e1d9,bg=#ac795a,bold] #S #[fg=#ac795a,bg=#e0d7cd,nobold] "
set -g status-right "#[fg=#a89b8e]%Y-%m-%d #[fg=#928579]%H:%M #[fg=#e8e1d9,bg=#a183a2,bold] #h "

set -g window-status-format " #I #W#{?window_flags,#{window_flags}, } "
set -g window-status-current-format " #I #W#{?window_flags,#{window_flags}, } "
set -g window-status-separator ""
