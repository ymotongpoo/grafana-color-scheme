# palette.toml — single source of truth for the Grafana color scheme.
#
# The resolved hex values in this file are AUTHORITATIVE. The [*.derivation]
# tables document how they were produced; nothing recomputes them at build
# time, so a human can nudge one value without fighting an algorithm.
#
# Contrast ratios are deliberately NOT stored here. They are computed from
# these values by `tools/generate.py --verify` and by README generation, so
# they can never go stale.
#
# Brand colors come from the Grafana Labs brand guide; reading colors are hand-tuned. This is not an official
# Grafana Labs project; see NOTICE.

schema_version = 1

[scheme]
name           = "Grafana"
slug           = "grafana"
homepage       = "https://github.com/ymotongpoo/grafana-color-scheme"
author         = "Yoshi Yamaguchi"
license        = "Apache-2.0"
variants       = ["dark", "light"]
flavors        = ["dim", "vivid"]
default_flavor = "dim"

# ─── Layer 1: brand ──────────────────────────────────────────────────────────
#
# Grafana Labs brand guide values, verbatim. Never edit these to fix a
# contrast failure — edit the variant accents instead.

[brand.colors]
"neutral-1"   = { hex = "#f4f4f4", group = "neutral" }
"neutral-2"   = { hex = "#afafaf", group = "neutral" }
"neutral-3"   = { hex = "#696969", group = "neutral" }
"neutral-4"   = { hex = "#3a3a3a", group = "neutral" }
"neutral-5"   = { hex = "#171717", group = "neutral" }
"white"       = { hex = "#ffffff", group = "secondary" }
"black"       = { hex = "#000000", group = "secondary" }
"orange"      = { hex = "#ff671d", group = "primary", note = "the primary brand color" }
"yellow"      = { hex = "#ffed23", group = "secondary" }
"green"       = { hex = "#04bc4c", group = "secondary" }
"blue"        = { hex = "#2970ff", group = "secondary" }
"purple"      = { hex = "#d444f1", group = "secondary" }
"amber"       = { hex = "#ffab29", group = "support" }
"light-green" = { hex = "#91d441", group = "support" }
"light-blue"  = { hex = "#3fc6eb", group = "support" }
"indigo"      = { hex = "#7d64ff", group = "support" }
"pink"        = { hex = "#f35998", group = "support" }

# The brand has NO red. error / deleted map onto `pink` and warning onto
# `amber`. See [roles.diagnostic] and docs/roles.md.

# Tint and shade ladders from the brand guide. Note that the 100% step of a
# ladder is NOT always identical to the secondary color of the same name --
# the guide lists green as #04bc4c but its ladder centers on #18b16a. Both
# are reproduced faithfully; the ladders are what the variants draw from.
[brand.ladders]
orange = { "20" = "#fee9d4", "40" = "#ffd0a7", "60" = "#ffad70", "80" = "#ff8137", "100" = "#ff671d", "120" = "#f04205", "140" = "#c72f07", "160" = "#9d250e", "180" = "#7f230f" }
yellow = { "20" = "#fcffd2", "40" = "#fffea8", "60" = "#fff86b", "80" = "#feed55", "100" = "#fbe136", "120" = "#fdc809", "140" = "#cf9304", "160" = "#aa710e", "180" = "#915d14" }
green  = { "20" = "#d7f9e3", "40" = "#aaf0c7", "60" = "#72e1a6", "80" = "#54d192", "100" = "#18b16a", "120" = "#0c9065", "140" = "#0b7347", "160" = "#0a5b39", "180" = "#084b31" }
blue   = { "20" = "#d9e7ff", "40" = "#bbd8ff", "60" = "#8dc0ff", "80" = "#599bff", "100" = "#2870ff", "120" = "#1b55f5", "140" = "#1540e0", "160" = "#1734b6", "180" = "#1a308f" }
purple = { "20" = "#f9e8fe", "40" = "#f3ceff", "60" = "#eeaafd", "80" = "#e477fb", "100" = "#d444f0", "120" = "#bb23d5", "140" = "#9d1ab1", "160" = "#831790", "180" = "#6e1976" }

# ─── Layer 2: dark variant ───────────────────────────────────────────────────

[variants.dark]
id         = "grafana-dark"
appearance = "dark"
label      = "Grafana Dark"

[variants.dark.derivation]
background     = "warm gray, hand-tuned to #241f1c"
accents        = "muted Grafana hues, inspired by Nord pastel colors; no minimum contrast target"
reference      = "docs/derivation.md"

# Shadow: base -> mantle -> crust. Elevation: base -> surface0 -> surface1 -> surface2.
[variants.dark.surfaces]
crust          = "#181411"
mantle         = "#1e1916"
base           = "#241f1c"
surface0       = "#2c2622"
surface1       = "#362f2a"
surface2       = "#423932"

[variants.dark.text]
bright         = "#cbc3ba"
fg             = "#b9b1a9"
subtext        = "#8d8279"
faint          = "#786d63"

[variants.dark.accents]
orange         = "#c18c68"
amber          = "#b4a075"
yellow         = "#acaa70"
green          = "#89a17e"
light-green    = "#79a08a"
light-blue     = "#789fa6"
blue           = "#8198b5"
indigo         = "#8d86b1"
purple         = "#ad8eaf"
pink           = "#b77f94"

# Vivid preserves the previous default palette, including all UI colors.
[variants.dark.vivid.surfaces]
crust          = "#141414"
mantle         = "#191919"
base           = "#1e1e1e"
surface0       = "#252525"
surface1       = "#303030"
surface2       = "#3a3a3a"

[variants.dark.vivid.text]
bright         = "#f4f4f4"
fg             = "#c9c9c9"
subtext        = "#9e9e9e"
faint          = "#8c8c8c"

[variants.dark.vivid.accents]
orange         = "#e47534"
amber          = "#d28f27"
yellow         = "#bdaa2f"
green          = "#7ab03a"
light-green    = "#48aa78"
light-blue     = "#38a4c2"
blue           = "#77a0d2"
indigo         = "#9084d7"
purple         = "#c48ed0"
pink           = "#e2548e"

# Browser chrome is a branding surface, not a reading surface. A browser
# theme that leaves the frame neutral and only tints the icons reads as "grey
# browser with orange icons" rather than as the brand, so the key color goes
# on the frame and toolbar and the text on top flips to whatever contrasts.
# This is why these are their own tokens: `accent` is a syntax role and is
# derived to sit QUIETLY against a code background, which is the opposite of
# what a browser frame needs.
# The tab strip is the part people actually have to read. Unselected tabs
# carry the key color so the strip reads as one branded band, and the
# selected tab breaks away to a clearly different surface -- if the two are
# merely adjacent steps of the same ramp, the selected tab is hard to spot.
# `key_soft` is that surface, and it also fills the toolbar, since Chrome
# merges the selected tab into it.
# The key color does not change between variants: it is the brand, and the
# brand does not get darker because the user prefers a dark editor. So `key`,
# `on_key` and `key_accent` are identical to the light variant, and only the
# content surfaces below them flip. An earlier version used orange-140 here,
# which read as a duller, browner orange rather than as Grafana's.
# These browser tokens are independent of the palette redesign above and
# retain their values through it.
[variants.dark.browser]
key         = "#ff671d"   # brand orange, frame and UNSELECTED tabs -- same as light
on_key      = "#171717"   # text and icons on key -- same as light
key_soft    = "#33261f"   # SELECTED tab and toolbar; base warmed toward brand orange
on_key_soft = "#c9c9c9"   # text and icons on key_soft
key_accent  = "#ff8137"   # orange-80, button background -- same as light
ntp_bg      = "#251d19"   # new tab page, kept a step below the toolbar so the
                          # page reads as content rather than as more chrome
ntp_fg      = "#c9c9c9"
ntp_link    = "#38a4c2"   # preserved browser link, checked against ntp_bg
ntp_header  = "#e47534"   # preserved browser heading, checked against ntp_bg
omnibox_bg  = "#1e1e1e"
omnibox_fg  = "#c9c9c9"
# Bottom-right artwork on the new tab page. The file is a hand-managed asset
# under a different license from the rest of the repo; see NOTICE. A theme
# cannot randomize this -- it is one static image baked in at install time.
ntp_image   = "images/grot.png"

# ─── Layer 3: light variant ──────────────────────────────────────────────────

[variants.light]
id         = "grafana-light"
appearance = "light"
label      = "Grafana Light"

[variants.light.derivation]
background     = "warm gray, hand-tuned to #e8e1d9"
accents        = "muted Grafana hues, inspired by Nord pastel colors; no minimum contrast target"
reference      = "docs/derivation.md"

[variants.light.surfaces]
crust          = "#d2c8bd"
mantle         = "#e0d7cd"
base           = "#e8e1d9"
surface0       = "#e0d5ca"
surface1       = "#d3c5b8"
surface2       = "#c4b2a2"

[variants.light.text]
bright         = "#574e47"
fg             = "#6b625b"
subtext        = "#928579"
faint          = "#a89b8e"

[variants.light.accents]
orange         = "#ac795a"
amber          = "#a08a61"
yellow         = "#989363"
green          = "#7d9068"
light-green    = "#6f9381"
light-blue     = "#719399"
blue           = "#7b8da5"
indigo         = "#8a80aa"
purple         = "#a183a2"
pink           = "#ac7b8d"

# Vivid preserves the previous default palette, including all UI colors.
[variants.light.vivid.surfaces]
crust          = "#e4e4e4"
mantle         = "#f0f0f0"
base           = "#f7f7f7"
surface0       = "#ececec"
surface1       = "#dcdcdc"
surface2       = "#c9c9c9"

[variants.light.vivid.text]
bright         = "#171717"
fg             = "#3a3a3a"
subtext        = "#5e5e5e"
faint          = "#6a6a6a"

[variants.light.vivid.accents]
orange         = "#c72f07"
amber          = "#915d14"
yellow         = "#6f681c"
green          = "#0b7347"
light-green    = "#084b31"
light-blue     = "#25708a"
blue           = "#1540e0"
indigo         = "#5240b8"
purple         = "#9d1ab1"
pink           = "#a93c68"

[variants.light.browser]
key         = "#ff671d"   # brand orange, frame and UNSELECTED tabs
on_key      = "#171717"   # text and icons on key
key_soft    = "#fee9d4"   # SELECTED tab and toolbar; orange-20, the near-white step
on_key_soft = "#171717"
key_accent  = "#ff8137"   # orange-80, button background
ntp_bg      = "#fef3e7"   # new tab page; orange-20 lifted 45% toward white
ntp_fg      = "#3a3a3a"
ntp_link    = "#25708a"   # preserved browser link, checked against ntp_bg
ntp_header  = "#c72f07"   # preserved browser heading, checked against ntp_bg
omnibox_bg  = "#ffffff"
omnibox_fg  = "#3a3a3a"
ntp_image   = "images/grot.png"

# ─── Layer 4: semantics ──────────────────────────────────────────────────────
#
# Roles reference TOKEN NAMES, resolved per variant against
# accents u text u surfaces. Change a role here and all 11 targets follow.

[roles]
keyword       = { color = "orange" }
keyword-ctrl  = { color = "orange" }
keyword-op    = { color = "orange" }
operator      = { color = "orange" }
builtin       = { color = "amber" }
decorator     = { color = "amber" }
attribute     = { color = "amber" }
string        = { color = "green" }
string-doc    = { color = "green", style = "italic" }
string-escape = { color = "amber" }
regex         = { color = "pink" }
number        = { color = "light-blue" }
boolean       = { color = "light-blue" }
constant      = { color = "light-blue" }
type          = { color = "blue" }
class         = { color = "blue" }
namespace     = { color = "blue" }
interface     = { color = "blue" }
function      = { color = "purple" }
method        = { color = "purple" }
variable      = { color = "fg" }
parameter     = { color = "fg" }
property      = { color = "light-green" }
tag           = { color = "orange" }
label          = { color = "amber" }
preprocessor  = { color = "indigo" }
punctuation   = { color = "subtext" }
comment       = { color = "subtext", style = "italic" }
comment-doc   = { color = "subtext", style = "italic" }
link          = { color = "light-blue", style = "underline" }
heading       = { color = "orange", style = "bold" }
deprecated    = { color = "faint", style = "strikethrough" }

[roles.diagnostic]
error   = { color = "pink", note = "the brand has no red, so pink carries the error role" }
warning = { color = "amber" }
info    = { color = "blue" }
hint    = { color = "subtext" }
ok      = { color = "green" }

[roles.diff]
added    = { color = "green" }
removed  = { color = "pink" }
changed  = { color = "yellow" }

# ─── ANSI 16 ─────────────────────────────────────────────────────────────────
#
# Consumed by WezTerm, iTerm2, tmux, Zed's terminal.ansi.*, VS Code's
# terminal.ansi*, Vim's g:terminal_ansi_colors, and Herdr's `terminal` mode.
#
# Each flavor has a complete ANSI table resolved against its own colors.
# Dim brights 9-14 blend the normal color 8% toward text.fg (sRGB).
#
# Slot 0 and 15 are the extremes of the variant, which means the dark and
# light mappings are structurally mirrored, not identical.

[ansi.dark.dim]
0              = "surfaces.surface1"
1              = "accents.pink"
2              = "accents.green"
3              = "accents.amber"
4              = "accents.blue"
5              = "accents.purple"
6              = "accents.light-blue"
7              = "text.fg"
8              = "text.faint"
9              = "#b78396"
10             = "#8da281"
11             = "#b4a179"
12             = "#859ab4"
13             = "#ae91af"
14             = "#7da0a6"
15             = "text.bright"

[ansi.light.dim]
0              = "text.bright"
1              = "accents.pink"
2              = "accents.green"
3              = "accents.amber"
4              = "accents.blue"
5              = "accents.purple"
6              = "accents.light-blue"
7              = "surfaces.surface1"
8              = "text.subtext"
9              = "#a77989"
10             = "#7c8c67"
11             = "#9c8761"
12             = "#7a8a9f"
13             = "#9d809c"
14             = "#718f94"
15             = "#efe8e0"

[ansi.dark.vivid]
0              = "surfaces.surface1"
1              = "accents.pink"
2              = "accents.green"
3              = "accents.amber"
4              = "accents.blue"
5              = "accents.purple"
6              = "accents.light-blue"
7              = "text.fg"
8              = "text.faint"
9              = "#e56c9d"
10             = "#8cba56"
11             = "#d79e46"
12             = "#8aadd7"
13             = "#cb9dd5"
14             = "#54b0ca"
15             = "text.bright"

[ansi.light.vivid]
0              = "text.bright"
1              = "accents.pink"
2              = "accents.green"
3              = "accents.amber"
4              = "accents.blue"
5              = "accents.purple"
6              = "accents.light-blue"
7              = "surfaces.surface1"
8              = "text.subtext"
9              = "#93365c"
10             = "#0d6540"
11             = "#7f5214"
12             = "#153ac2"
13             = "#891a9a"
14             = "#236379"
15             = "#ffffff"

[terminal]
cursor_bg    = "accents.orange"
cursor_fg    = "surfaces.base"
selection_bg = "surfaces.surface2"
selection_fg = "text.bright"
split        = "surfaces.surface1"

# ─── Browser contrast policy ────────────────────────────────────────────────────
#
# Browser-only contrast rules. Reading palettes intentionally have no
# minimum contrast requirement; ratios in documentation are informational.

[[contrast.rules]]
tokens  = "browser.on_key"
against = "browser.key"
min     = 4.5
why     = "tab titles, bookmarks and toolbar text sit directly on the key color"

[[contrast.rules]]
tokens  = "browser.on_key_soft"
against = "browser.key_soft"
min     = 4.5
why     = "the selected tab and the whole toolbar"

[[contrast.rules]]
tokens  = "browser.on_key"
against = "browser.key_accent"
min     = 4.5
why     = "button labels"

[[contrast.rules]]
tokens  = ["browser.ntp_fg", "browser.ntp_link", "browser.ntp_header"]
against = "browser.ntp_bg"
min     = 4.5
why     = "the new tab page has its own tinted background, so the syntax accents drawn on it must be re-checked against that surface rather than against surfaces.base"

[[contrast.rules]]
tokens  = "browser.omnibox_fg"
against = "browser.omnibox_bg"
min     = 4.5
why     = "the address bar"

[contrast.separation]
accent_delta_e_min = 8.0
why = "mixing toward the background can collapse two brand hues into the same color; CIE76 pairwise across accents catches it"

[ansi.constraints]
slot0_not_base   = true
why = "slot 0 equal to the background makes `bg=black` invisible"

# ─── Target-specific pins ────────────────────────────────────────────────────

[targets.zed]
schema = "https://zed.dev/schema/themes/v0.2.0.json"

[targets.chroma]
module = "github.com/alecthomas/chroma/v2"
note   = "v3 is alpha-only as of 2026-09; the XML format is identical on both"

[targets.herdr]
validated_against = "herdr 0.8"
note = "Herdr has no external theme file mechanism; the deliverable is a config.toml fragment. Its token vocabulary is Catppuccin-flavored, so the mapping is lossy and documented in targets/herdr/README.md"

[targets.vscode]
engine = "^1.90.0"

[targets.slack]
note = "8 values are the stable documented form; a 10-value variant adding top-nav colors also parses. The file ships 8."
